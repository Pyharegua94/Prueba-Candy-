<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Gemas - 10 Niveles</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --panel-color: #1d1836;
            --accent-color: #7b2cbf;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            margin-bottom: 10px;
            text-align: center;
        }

        h1 {
            margin: 5px 0;
            font-size: 2.5rem;
            text-shadow: 0 0 10px var(--accent-color);
            background: linear-gradient(45deg, #ff007f, #7b2cbf, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background-color: var(--panel-color);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(123, 44, 191, 0.3);
            align-items: center;
        }

        @media (min-width: 768px) {
            .game-container {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 200px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-box {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .stat-value {
            font-size: 1.6rem;
            color: #00f0ff;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 55px);
            grid-template-rows: repeat(8, 55px);
            gap: 4px;
            background-color: rgba(0, 0, 0, 0.4);
            padding: 8px;
            border-radius: 12px;
            border: 2px solid var(--accent-color);
            touch-action: none;
        }

        .cell {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
            user-select: none;
        }

        .cell:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .cell.selected {
            background-color: rgba(123, 44, 191, 0.6);
            transform: scale(0.9);
            box-shadow: 0 0 12px #7b2cbf;
        }

        .gem {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.2s ease;
        }

        /* Diseños de gemas usando gradientes planos y emojis de referencia */
        .gem-red { background: radial-gradient(circle at 35% 35%, #ff4d6d, #c9184a); box-shadow: 0 4px 10px rgba(201, 24, 74, 0.5); }
        .gem-blue { background: radial-gradient(circle at 35% 35%, #00b4d8, #0077b6); box-shadow: 0 4px 10px rgba(0, 119, 182, 0.5); }
        .gem-green { background: radial-gradient(circle at 35% 35%, #52b788, #2d6a4f); box-shadow: 0 4px 10px rgba(45, 106, 79, 0.5); }
        .gem-yellow { background: radial-gradient(circle at 35% 35%, #ffdd00, #ffaa00); box-shadow: 0 4px 10px rgba(255, 170, 0, 0.5); }
        .gem-purple { background: radial-gradient(circle at 35% 35%, #b5179e, #7209b7); box-shadow: 0 4px 10px rgba(114, 9, 183, 0.5); }
        .gem-orange { background: radial-gradient(circle at 35% 35%, #ff9e00, #ff6000); box-shadow: 0 4px 10px rgba(255, 96, 0, 0.5); }
        
        /* Modificadores especiales */
        .gem-line-v { border-left: 4px dashed #fff; border-right: 4px dashed #fff; border-radius: 30%; }
        .gem-line-h { border-top: 4px dashed #fff; border-bottom: 4px dashed #fff; border-radius: 30%; }
        .gem-rainbow { background: linear-gradient(45deg, red, orange, yellow, green, blue, purple); box-shadow: 0 0 15px #fff; border-radius: 35%; animation: pulse 1s infinite alternate; }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { background-color: #9d4edd; }
        button:active { transform: scale(0.95); }

        .toggle-btn {
            background-color: #3c355a;
        }
        .toggle-btn.active {
            background-color: #00b4d8;
        }
    </style>
</head>
<body>

    <header>
        <h1>💎 CRISALIDA QUEST 💎</h1>
        <p>Une 3 o más gemas iguales antes de quedarte sin movimientos.</p>
    </header>

    <div class="game-container">
        <!-- Panel de Control e Información -->
        <div class="dashboard">
            <div class="stat-box">
                <div>Nivel Actual</div>
                <div id="txtNivel" class="stat-value">1</div>
            </div>
            <div class="stat-box">
                <div>Objetivo</div>
                <div id="txtObjetivo" class="stat-value">500</div>
            </div>
            <div class="stat-box">
                <div>Puntuación</div>
                <div id="txtPuntos" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <div>Movimientos</div>
                <div id="txtMovimientos" class="stat-value">30</div>
            </div>

            <div class="controls">
                <button onclick="reiniciarNivelActual()">Reiniciar</button>
                <button id="btnAudio" class="toggle-btn active" onclick="toggleAudio()">🔊 FX</button>
            </div>
        </div>

        <!-- Tablero de Juego -->
        <div id="board"></div>
    </div>

    <script>
        // CONFIGURACIÓN DE LOS 10 NIVELES PROGRESIVOS
        const configuracionNiveles = [
            { nivel: 1, objetivo: 500, movimientos: 30, colores: 4 },
            { nivel: 2, objetivo: 1200, movimientos: 28, colores: 4 },
            { nivel: 3, objetivo: 2500, movimientos: 25, colores: 4 },
            { nivel: 4, objetivo: 4000, movimientos: 25, colores: 5 },
            { nivel: 5, objetivo: 6000, movimientos: 22, colores: 5 },
            { nivel: 6, objetivo: 8500, movimientos: 22, colores: 5 },
            { nivel: 7, objetivo: 11000, movimientos: 20, colores: 6 },
            { nivel: 8, objetivo: 14000, movimientos: 20, colores: 6 },
            { nivel: 9, objetivo: 18000, movimientos: 18, colores: 6 },
            { nivel: 10, objetivo: 25000, movimientos: 15, colores: 6 }
        ];

        // Mapeo de IDs de colores a clases CSS y formas visuales
        const tiposGemas = [
            { id: 0, clase: 'gem-red', texto: '❤️' },
            { id: 1, clase: 'gem-blue', texto: '💧' },
            { id: 2, clase: 'gem-green', texto: '⭐' },
            { id: 3, clase: 'gem-yellow', texto: '☀️' },
            { id: 4, clase: 'gem-purple', texto: '🔮' },
            { id: 5, clase: 'gem-orange', texto: '🔥' }
        ];

        // Estado del Motor del Juego
        const FILAS = 8;
        const COLUMNAS = 8;
        let tablero = [];
        let nivelActual = 1;
        let puntos = 0;
        let movimientosRestantes = 0;
        let casillaSeleccionada = null;
        let permitiendoInteraccion = true;
        let audioActivado = true;

        // Inicializador nativo de Audio sintetizado para evitar dependencias externas
        const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
        function reproducirSonido(frecuencia, tipo, duracion) {
            if (!audioActivado) return;
            try {
                let osc = ctxAudio.createOscillator();
                let gain = ctxAudio.createGain();
                osc.type = tipo;
                osc.frequency.value = frecuencia;
                gain.gain.setValueAtTime(0.2, ctxAudio.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctxAudio.currentTime + duracion);
                osc.connect(gain);
                gain.connect(ctxAudio.destination);
                osc.start();
                osc.stop(ctxAudio.currentTime + duracion);
            } catch(e) {}
        }

        function toggleAudio() {
            audioActivado = !audioActivado;
            document.getElementById('btnAudio').classList.toggle('active', audioActivado);
        }

        // Arranque Inicial del Juego
        window.onload = () => {
            cargarNivel(1);
        };

        // Carga la información estructurada del nivel
        function cargarNivel(numeroNivel) {
            const config = configuracionNiveles.find(n => n.nivel === numeroNivel);
            if (!config) return;

            nivelActual = numeroNivel;
